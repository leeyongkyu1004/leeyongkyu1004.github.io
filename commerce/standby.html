<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>매장 이름</title>
<style>
  :root {
    --bg-1: #0b1020;
    --bg-2: #131c37;
    --accent: #4f8cff;
    --accent-2: #7ee3ff;
    --text: #f4f7ff;
    --text-dim: rgba(244, 247, 255, 0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 50% 30%, var(--bg-2), var(--bg-1) 70%);
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  /* 은은하게 움직이는 배경 광원 */
  .glow {
    position: absolute;
    width: 60vw;
    height: 60vw;
    max-width: 900px;
    max-height: 900px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(79, 140, 255, 0.35), rgba(79, 140, 255, 0) 65%);
    filter: blur(10px);
    animation: drift 12s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes drift {
    0%   { transform: translate(-8%, -4%) scale(1); }
    100% { transform: translate(8%, 6%) scale(1.15); }
  }

  .brand {
    position: relative;
    z-index: 2;
  }

  /* TODO: 로고 이미지로 교체하려면 이 자리에 <img> 태그를 넣고 아래 h1은 지우세요 */
  .brand h1 {
    font-size: clamp(3rem, 8vw, 6.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    background: linear-gradient(120deg, var(--text) 30%, var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .brand p.tagline {
    margin-top: 0.75rem;
    font-size: clamp(1rem, 2vw, 1.4rem);
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }

  .cta {
    position: relative;
    z-index: 2;
    margin-top: 4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.6rem;
  }

  .cta .pulse-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 0 0 rgba(126, 227, 255, 0.6);
    animation: pulse 1.8s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(126, 227, 255, 0.55); }
    70%  { box-shadow: 0 0 0 22px rgba(126, 227, 255, 0); }
    100% { box-shadow: 0 0 0 0 rgba(126, 227, 255, 0); }
  }

  .cta span.label {
    font-size: clamp(1.1rem, 2.4vw, 1.6rem);
    font-weight: 600;
    letter-spacing: 0.04em;
    animation: fade 1.8s ease-in-out infinite;
  }

  @keyframes fade {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  footer {
    position: absolute;
    bottom: 2rem;
    left: 0;
    right: 0;
    z-index: 2;
    font-size: 0.85rem;
    color: var(--text-dim);
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="glow"></div>

    <div class="brand">
      <!-- TODO: 매장 이름/로고로 교체 -->
      <h1>매장 이름</h1>
      <p class="tagline">즐거운 시간을 시작해보세요</p>
    </div>

    <div class="cta">
      <div class="pulse-dot"></div>
      <span class="label">화면을 터치하여 시작하세요</span>
    </div>

    <footer>© 2026 매장 이름. All rights reserved.</footer>
  </div>
</body>
</html>
