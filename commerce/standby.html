<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>EVERYONE'S APPROACH</title>
<style>
  :root {
    --bg-1: #000000;
    --bg-2: #0a0d14;
    --white: #f5f7fa;
    --gold: #e7c27a;
    --gold-bright: #ffe1a3;
    --dim: rgba(245, 247, 250, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #000;
    color: var(--white);
    -webkit-user-select: none;
    user-select: none;
  }

  .stage {
    position: relative;
    z-index: 2;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 4vh 5vw;
  }

  /* ── 배경 자동 슬라이드 (임시 이미지 3장, slide1~3.jpg를 이 html과 같은 폴더에 넣으면 표시됨) ── */
  /* body 배경의 캔버스 규칙 때문에 음수 z-index를 쓰면 안 보이므로 0/1로 배치하고 .stage를 2로 올림 */
  .bg-slider {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .bg-slider .slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: slideShow 18s infinite;
  }

  .bg-slider .slide:nth-child(1) { background-image: url("slide1.jpg"); animation-delay: 0s; }
  .bg-slider .slide:nth-child(2) { background-image: url("slide2.jpg"); animation-delay: 6s; }
  .bg-slider .slide:nth-child(3) { background-image: url("slide3.jpg"); animation-delay: 12s; }

  @keyframes slideShow {
    0%   { opacity: 0; }
    3%   { opacity: 1; }
    30%  { opacity: 1; }
    36%  { opacity: 0; }
    100% { opacity: 0; }
  }

  /* 사진 위 텍스트 가독성을 위한 어둡게 깔아주는 막 */
  .scrim {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.55) 55%),
      linear-gradient(180deg, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.75) 60%, rgba(0, 0, 0, 0.85));
  }

  /* ── 로고 마크 (매장 외관 사인의 삼각형 "A" 마크를 재현) ── */
  .mark {
    width: clamp(64px, 9vw, 110px);
    height: clamp(64px, 9vw, 110px);
    margin-bottom: 1.6rem;
    filter: drop-shadow(0 0 14px rgba(255, 255, 255, 0.55))
            drop-shadow(0 0 34px rgba(255, 255, 255, 0.25));
    animation: markGlow 3.2s ease-in-out infinite;
  }

  @keyframes markGlow {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(255,255,255,0.4)) drop-shadow(0 0 26px rgba(255,255,255,0.18)); }
    50%      { filter: drop-shadow(0 0 18px rgba(255,255,255,0.7)) drop-shadow(0 0 44px rgba(255,255,255,0.32)); }
  }

  .mark path {
    fill: none;
    stroke: var(--white);
    stroke-width: 7;
    stroke-linejoin: round;
  }

  /* ── 워드마크 ── */
  .wordmark .kicker {
    display: block;
    font-size: clamp(0.85rem, 1.6vw, 1.15rem);
    font-weight: 600;
    letter-spacing: 0.5em;
    color: var(--dim);
    text-transform: uppercase;
    margin-bottom: 0.6rem;
  }

  .wordmark h1 {
    font-size: clamp(2.6rem, 7vw, 5.6rem);
    font-weight: 800;
    letter-spacing: -0.01em;
    color: var(--white);
    text-shadow: 0 0 24px rgba(255, 255, 255, 0.35);
  }

  .wordmark .sub {
    margin-top: 0.5rem;
    font-size: clamp(1.1rem, 2.4vw, 1.6rem);
    font-weight: 500;
    color: var(--dim);
    letter-spacing: 0.08em;
  }

  /* ── 서비스 태그 목록 ── */
  .services {
    margin-top: 2.4rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 0.6rem 1rem;
  }

  .services span {
    font-size: clamp(0.85rem, 1.5vw, 1.05rem);
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--dim);
    padding: 0.35rem 0.9rem;
    border: 1px solid rgba(245, 247, 250, 0.25);
    border-radius: 999px;
  }

  /* ── 태그라인 (PLAY > POINT > SHOP) ── */
  .tagline {
    margin-top: 2.6rem;
  }

  .tagline .flow {
    font-size: clamp(1.3rem, 3vw, 2.2rem);
    font-weight: 800;
    letter-spacing: 0.06em;
    color: var(--gold-bright);
    text-shadow: 0 0 20px rgba(231, 194, 122, 0.55);
  }

  .tagline .flow .arrow {
    margin: 0 0.4em;
    opacity: 0.85;
  }

  .tagline .kr {
    margin-top: 0.6rem;
    font-size: clamp(1rem, 2vw, 1.3rem);
    font-weight: 600;
    color: var(--dim);
  }

  /* ── 터치 안내 ── */
  .cta {
    position: absolute;
    bottom: 9vh;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.7rem;
  }

  .cta .pulse-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 0 0 rgba(231, 194, 122, 0.55);
    animation: pulse 1.8s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(231, 194, 122, 0.5); }
    70%  { box-shadow: 0 0 0 22px rgba(231, 194, 122, 0); }
    100% { box-shadow: 0 0 0 0 rgba(231, 194, 122, 0); }
  }

  .cta span.label {
    font-size: clamp(1.05rem, 2.2vw, 1.5rem);
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--white);
    animation: fade 1.8s ease-in-out infinite;
  }

  @keyframes fade {
    0%, 100% { opacity: 0.55; }
    50%      { opacity: 1; }
  }

  footer {
    position: absolute;
    bottom: 2vh;
    left: 0;
    right: 0;
    font-size: 0.8rem;
    color: var(--dim);
    letter-spacing: 0.03em;
  }
</style>
</head>
<body>
  <div class="bg-slider">
    <div class="slide"></div>
    <div class="slide"></div>
    <div class="slide"></div>
  </div>
  <div class="scrim"></div>

  <div class="stage">

    <!-- 로고 마크: 실제 로고 이미지가 있으면 이 svg를 <img src="logo.png"> 로 교체하세요 -->
    <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <path d="M50 10 L90 88 L64 88 L50 60 L36 88 L10 88 Z" />
    </svg>

    <div class="wordmark">
      <span class="kicker">Everyone's</span>
      <h1>APPROACH</h1>
      <p class="sub">모두의 아프로치</p>
    </div>

    <div class="services">
      <span>BINGO ARENA</span>
      <span>GOLF</span>
      <span>GOLDEN BELL</span>
      <span>CAFE</span>
      <span>SHOPPING</span>
    </div>

    <div class="tagline">
      <p class="flow">PLAY<span class="arrow">→</span>POINT<span class="arrow">→</span>SHOP</p>
      <p class="kr">게임하고! 포인트 받고! 쇼핑하고!</p>
    </div>

    <div class="cta">
      <div class="pulse-dot"></div>
      <span class="label">화면을 터치하여 시작하세요</span>
    </div>

    <footer>© 2026 EVERYONE'S APPROACH · 모두의 아프로치. All rights reserved.</footer>
  </div>
</body>
</html>
