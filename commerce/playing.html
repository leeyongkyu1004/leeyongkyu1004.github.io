<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>EVERYONE'S APPROACH - Playing</title>
<style>
  :root {
    --white: #f5f7fa;
    --gold-bright: #ffe1a3;
    --dim: rgba(245, 247, 250, 0.6);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    background: #000;
    color: var(--white);
    -webkit-user-select: none;
    user-select: none;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* 게임 진행 중 배경 슬라이드 (게임 이미지 위주로 에너제틱하게) */
  .bg-slider {
    position: fixed;
    inset: 0;
    z-index: 0;
  }

  .bg-slider .slide {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    opacity: 0;
    animation: slideShow 16s infinite;
  }

  .bg-slider .slide:nth-child(1) { background-image: url("slide2.jpg"); animation-delay: 0s; }
  .bg-slider .slide:nth-child(2) { background-image: url("slide3.jpg"); animation-delay: 8s; }

  @keyframes slideShow {
    0%   { opacity: 0; }
    4%   { opacity: 1; }
    44%  { opacity: 1; }
    50%  { opacity: 0; }
    100% { opacity: 0; }
  }

  .scrim {
    position: fixed;
    inset: 0;
    z-index: 1;
    background:
      radial-gradient(ellipse at 50% 100%, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.7) 60%),
      linear-gradient(180deg, rgba(0, 0, 0, 0.75), rgba(0, 0, 0, 0.5) 40%, rgba(0, 0, 0, 0.8));
  }

  .banner {
    position: absolute;
    z-index: 2;
    top: 5vh;
    left: 0;
    right: 0;
    text-align: center;
  }

  .banner .kicker {
    font-size: clamp(0.8rem, 1.4vw, 1rem);
    font-weight: 600;
    letter-spacing: 0.3em;
    color: var(--dim);
    text-transform: uppercase;
  }

  .banner h1 {
    margin-top: 0.5rem;
    font-size: clamp(1.6rem, 3.4vw, 2.6rem);
    font-weight: 800;
    color: var(--gold-bright);
    text-shadow: 0 0 18px rgba(255, 225, 163, 0.5);
  }

  .footerline {
    position: absolute;
    z-index: 2;
    bottom: 4vh;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(0.85rem, 1.5vw, 1.05rem);
    color: var(--dim);
  }
</style>
</head>
<body>
  <div class="bg-slider">
    <div class="slide"></div>
    <div class="slide"></div>
  </div>
  <div class="scrim"></div>

  <div class="stage">
    <div class="banner">
      <span class="kicker">Now Playing</span>
      <h1>즐거운 시간 보내세요!</h1>
    </div>

    <p class="footerline">EVERYONE'S APPROACH · 모두의 아프로치</p>
  </div>
</body>
</html>
