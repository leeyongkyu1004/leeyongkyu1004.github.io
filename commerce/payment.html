<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>EVERYONE'S APPROACH - Payment</title>
<style>
  :root {
    --white: #f5f7fa;
    --dim: rgba(245, 247, 250, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", -apple-system, BlinkMacSystemFont, sans-serif;
    /* 결제 화면은 시선 분산을 최소화하기 위해 정적인 단색 배경만 사용 (슬라이드/애니메이션 없음) */
    background: #050608;
    color: var(--white);
    -webkit-user-select: none;
    user-select: none;
  }

  .stage {
    position: relative;
    width: 100%;
    height: 100%;
  }

  /* 결제 UI를 가리지 않도록 로고는 화면 구석에 워터마크 형태로만 배치 */
  .watermark {
    position: absolute;
    top: 3vh;
    left: 3vh;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    opacity: 0.55;
  }

  .watermark .mark {
    width: 32px;
    height: 32px;
  }

  .watermark .mark path {
    fill: none;
    stroke: var(--white);
    stroke-width: 8;
    stroke-linejoin: round;
  }

  .watermark span {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--dim);
  }

  .notice {
    position: absolute;
    bottom: 4vh;
    left: 0;
    right: 0;
    text-align: center;
    font-size: clamp(0.85rem, 1.4vw, 1.05rem);
    color: var(--dim);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="watermark">
      <svg class="mark" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 10 L90 88 L64 88 L50 60 L36 88 L10 88 Z" />
      </svg>
      <span>EVERYONE'S APPROACH</span>
    </div>

    <p class="notice">안전하게 결제를 진행해주세요</p>
  </div>
</body>
</html>
