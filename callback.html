<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>네이버 로그인 처리중...</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    background: #f5f5f5;
  }
  .box { text-align: center; padding: 24px; max-width: 320px; }
  .spinner {
    width: 36px; height: 36px;
    border: 4px solid #ddd;
    border-top-color: #03c75a;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  p { color: #555; font-size: 14px; line-height: 1.5; }
  .error { color: #d9363e; font-weight: bold; }
  button {
    margin-top: 16px;
    padding: 12px 20px;
    font-size: 15px;
    background: #03c75a;
    color: #fff;
    border: none;
    border-radius: 8px;
    display: none;
  }
</style>
</head>
<body>
  <div class="box">
    <div class="spinner" id="spinner"></div>
    <p id="message">로그인 처리 중입니다...<br>잠시 후 앱으로 자동 이동합니다.</p>
    <button id="manualBtn">앱으로 돌아가기</button>
  </div>

<script>
  // 앱에서 등록한 커스텀 URL 스킴. 실제 앱 스킴과 반드시 동일해야 합니다.
  const APP_SCHEME = "naverlogin"; // 예: naverlogin://callback?code=...&state=...
  const APP_HOST = "callback";

  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");
  const state = params.get("state");
  const error = params.get("error");
  const errorDescription = params.get("error_description");

  const messageEl = document.getElementById("message");
  const spinnerEl = document.getElementById("spinner");
  const btnEl = document.getElementById("manualBtn");

  function buildDeepLink() {
    const qs = new URLSearchParams();
    if (error) {
      qs.set("error", error);
      if (errorDescription) qs.set("error_description", errorDescription);
    } else {
      qs.set("code", code || "");
      qs.set("state", state || "");
    }
    return `${APP_SCHEME}://${APP_HOST}?${qs.toString()}`;
  }

  const deepLink = buildDeepLink();

  function goToApp() {
    window.location.href = deepLink;
  }

  if (error) {
    messageEl.classList.add("error");
    messageEl.textContent = "로그인에 실패했습니다: " + (errorDescription || error);
  } else if (!code) {
    messageEl.classList.add("error");
    messageEl.textContent = "인가 코드(code)를 받지 못했습니다.";
  } else {
    // 자동으로 앱 딥링크 시도
    goToApp();
    setTimeout(function () {
      messageEl.textContent = "자동으로 이동하지 않으면 아래 버튼을 눌러주세요.";
      btnEl.style.display = "inline-block";
    }, 1200);
  }

  btnEl.addEventListener("click", goToApp);
</script>
</body>
</html>
