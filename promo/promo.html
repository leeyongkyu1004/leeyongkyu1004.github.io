<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>광고 팝업</title>
<style>
  * {
    box-sizing: border-box;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 배너 - 탭하면 CTA 메시지를 Unity로 보낸다 */
  .banner {
    flex: 1;
    min-height: 0;
    position: relative;
    background: linear-gradient(135deg, #5b7cfa 0%, #9b5bfa 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    overflow: hidden;
  }

  .banner img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }

  .banner img.visible {
    display: block;
  }

  /* 이미지가 없을 때 보이는 기본 문구 */
  .banner-text {
    position: absolute;
    padding: 24px;
    text-align: center;
    color: #ffffff;
  }

  .banner-text h1 {
    margin: 0 0 10px;
    font-size: 22px;
    line-height: 1.35;
    word-break: keep-all;
  }

  .banner-text p {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    opacity: 0.9;
    word-break: keep-all;
  }

  .banner-text.hidden {
    display: none;
  }

</style>
</head>
<body>
  <div class="banner" id="banner">
    <img id="adImage" alt="" />
    <div class="banner-text" id="bannerText">
      <h1 id="adTitle">이벤트 진행 중</h1>
      <p id="adBody">지금 참여하고 포인트를 받아가세요.</p>
    </div>
  </div>

<script>
  // 웹 -> Unity : NativeBrowser가 주입하는 브릿지로 JSON 문자열을 보낸다.
  // Unity의 WebViewPopupUI._onMessageReceived에서 이 문자열을 그대로 받는다.
  function sendToUnity(payload) {
    var message = JSON.stringify(payload);

    if (window.NativeBrowserBridge && window.NativeBrowserBridge.postMessage) {
      window.NativeBrowserBridge.postMessage(message);
    } else {
      // 브라우저에서 직접 열어 확인할 때를 위한 대비 (NativeBrowser 밖에서는 브릿지가 없음)
      console.log("NativeBrowserBridge 없음 : " + message);
    }
  }

  document.getElementById("banner").addEventListener("click", function () {
    sendToUnity({ type: "cta", link: currentLink });
  });

  // CTA를 눌렀을 때 Unity로 함께 넘길 링크 - setAd 메시지로 채워진다
  var currentLink = "";

  // Unity -> 웹 : 광고 내용을 런타임에 바꿔 끼운다. 페이지를 다시 배포하지 않아도
  // 제목/문구/이미지/링크를 앱에서 내려줄 수 있다.
  //   보내는 형식 : {"type":"setAd","title":"...","body":"...","image":"...","link":"..."}
  window.addEventListener("message", function (e) {
    var data;

    try {
      data = JSON.parse(e.data);
    } catch (error) {
      return;
    }

    if (!data || data.type !== "setAd") {
      return;
    }

    if (typeof data.title === "string") {
      document.getElementById("adTitle").textContent = data.title;
    }

    if (typeof data.body === "string") {
      document.getElementById("adBody").textContent = data.body;
    }

    if (typeof data.link === "string") {
      currentLink = data.link;
    }

    // 이미지를 내려주면 기본 그라데이션/문구 대신 이미지를 채운다
    if (typeof data.image === "string" && data.image.length > 0) {
      var image = document.getElementById("adImage");
      image.src = data.image;
      image.classList.add("visible");
      document.getElementById("bannerText").classList.add("hidden");
    }
  });
</script>
</body>
</html>
