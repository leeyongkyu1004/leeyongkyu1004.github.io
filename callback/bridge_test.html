<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebView Bridge Test</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    background: #f5f5f5;
  }
  .box { text-align: center; padding: 24px; max-width: 420px; width: 100%; box-sizing: border-box; }
  button {
    padding: 12px 20px;
    font-size: 15px;
    background: #fee500;
    color: #391b1b;
    border: none;
    border-radius: 8px;
    cursor: pointer;
  }
  #log {
    margin-top: 16px;
    text-align: left;
    white-space: pre-wrap;
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 8px;
    padding: 10px;
    height: 220px;
    overflow-y: auto;
    font-size: 12px;
    color: #333;
  }
</style>
</head>
<body>
  <div class="box">
    <h3>WebView Bridge Test</h3>
    <button id="sendBtn">Send test message to Unity</button>
    <div id="log"></div>
  </div>

<script>
  const logEl = document.getElementById("log");
  const sendBtn = document.getElementById("sendBtn");

  function log(msg) {
    logEl.textContent += msg + "\n";
    logEl.scrollTop = logEl.scrollHeight;
  }

  // Unity(NativeBrowser) -> 웹 : window.postMessage로 전달되어 여기서 수신
  window.addEventListener("message", function (e) {
    log("Received <- Unity : " + e.data);
  });

  // 웹 -> Unity(NativeBrowser) : window.NativeBrowserBridge.postMessage(...)로 전달
  sendBtn.addEventListener("click", function () {
    const msg = JSON.stringify({ type: "test", from: "web", time: Date.now() });

    if (window.NativeBrowserBridge && window.NativeBrowserBridge.postMessage) {
      window.NativeBrowserBridge.postMessage(msg);
      log("Sent -> Unity : " + msg);
    } else {
      log("NativeBrowserBridge를 찾을 수 없습니다 (NativeBrowser WebView 안에서 열어야 동작합니다).");
    }
  });

  log("Bridge test page ready.");
</script>
</body>
</html>
